# config/tasks.yaml
# 数据收集团队任务
market_research:
  description: "收集{company}的市场数据和行业信息"
  expected_output: "市场研究报告"

financial_data_collection:
  description: "收集{company}的财务报表和财务指标"
  expected_output: "财务数据报告"

technical_data_collection:
  description: "收集{company}的技术分析数据"
  expected_output: "技术数据报告"

# 分析团队任务
fundamental_analysis_task:
  description: "对{company}进行全面的基本面分析"
  expected_output: "详细的基本面分析报告"

risk_assessment_task:
  description: "对{company}进行全面的风险评估"
  expected_output: "全面的风险评估报告"

industry_analysis_task:
  description: "对{company}进行深度行业分析"
  expected_output: "深度行业分析报告"

quantitative_validation_task:
  description: "对{company}进行量化验证分析"
  expected_output: "量化验证报告"

analysis_coordination_task:
  description: "协调和整合所有分析工作"
  expected_output: "最终投资分析报告"

# 决策团队任务
investment_strategy_task:
  description: "为{company}制定投资策略建议"
  expected_output: "投资策略建议报告"

report_generation_task:
  description: "生成{company}的标准化投资分析报告"
  expected_output: "标准化投资分析报告"

quality_assurance_task:
  description: "对{company}的报告进行质量审核和把关"
  expected_output: "质量审核报告"