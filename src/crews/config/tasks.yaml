# 分析团队任务
fundamental_analysis:
  description: |
    基于以下采集数据，对{company}进行深度基本面分析：

    【财务数据】
    {financial_data}

    请完成以下分析：
    1. 分析财务报表（营收、利润、现金流、资产负债）
    2. 评估盈利能力指标（ROE、ROA、毛利率、净利率）
    3. 评估成长性（营收增长率、利润增长率）
    4. 评估财务健康度（负债率、流动比率、利息覆盖倍数）
    5. 计算合理估值区间和置信度
    6. 用量化方法验证分析结论的数据支撑
    7. 给出基本面评分（0-100）
  expected_output: "详细的基本面分析报告（含量化验证），含评分和详细分析"

risk_assessment:
  description: |
    基于以下采集数据，对{company}进行风险评估：

    【市场与技术数据】
    {risk_data}

    请完成以下分析：
    1. 分析市场风险（波动率、Beta、最大回撤）
    2. 分析行业风险（政策、竞争、技术变革）
    3. 分析公司特有风险（治理、财务、法律）
    4. 量化综合风险水平
    5. 给出风险评分（0-100，越低越安全）
  expected_output: "全面的风险评估报告，含评分和风险矩阵"

industry_analysis:
  description: |
    基于以下采集数据，对{company}所在行业进行深度分析：

    【市场与行业数据】
    {industry_data}

    请完成以下分析：
    1. 行业市场规模和增长趋势
    2. 竞争格局分析（波特五力模型）
    3. 公司在行业中的定位和竞争优势
    4. 行业发展趋势和机遇挑战
    5. 给出行业评分（0-100）
  expected_output: "深度行业分析报告，含评分和竞争分析"

analysis_coordination:
  description: |
    整合所有分析结果，形成最终的综合分析报告：
    1. 汇总基本面、风险、行业三个维度的评分
    2. 计算加权综合评分
    3. 分析各维度的一致性
    4. 给出综合投资建议
  expected_output: "最终投资分析报告，含综合评分和投资建议"

# 决策团队任务
investment_strategy:
  description: |
    基于以下分析结果，为{company}（{ticker}）制定投资策略：

    【协作评分】
    {scores}

    【分析建议】
    {analysis_recommendations}

    【各专家分析输出】
    {analysis_outputs}

    请基于以上数据：
    1. 评估当前估值水平
    2. 确定投资时机和仓位
    3. 制定买入/卖出策略
    4. 设置止损止盈位
  expected_output: "投资策略方案，含操作建议和置信度评分"

report_generation:
  description: |
    生成{company}的投资分析报告：
    1. 整合所有分析结果
    2. 生成投资建议
    3. 输出Markdown格式报告
    4. 导出JSON数据
    5. 审核数据来源可靠性和分析逻辑正确性
    6. 给出质量评分
  expected_output: "标准化投资分析报告（含质量审核）"